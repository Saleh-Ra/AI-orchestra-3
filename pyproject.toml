[project]
name = "ai-orchestra"
version = "1.00"
description = "CrewAI multi-agent pipeline for Hebrew/English LaTeX PDF generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai==1.14.7",
    "python-dotenv==1.2.2",
    "openai==2.41.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pymupdf>=1.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/smoke_test.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
